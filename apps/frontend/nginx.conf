server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/partidos/[^/]+/(simulador-partido|laboratorio-datos|diario-aprendizaje|modelos|directores|montecarlo-casa)/?$ {
    return 301 https://$host/$1/$is_args$args;
  }

  location ~ ^/partidos/[^/]+/?$ {
    try_files $uri $uri/ /partidos/_match/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
